version: "2.12"

services:
  seedmongodb:
    container_name: "Seed-MongoDB"
    image: mongo
    volumes:
      - seedDB:/data/db
      - seedDB:/data/configdb
    ports:
      - "27017-27019:27017-27019"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=SeedAdmin
      - MONGO_INITDB_ROOT_PASSWORD=SeedTest
      - MONGO_INITDB_DATABASE=Seed
    # Single-node replica set rs0, so the backend can use MongoDB transactions (atomic project import).
    # Root auth plus --replSet requires a keyFile. It is generated on every start, never stored in the repo or the volume.
    entrypoint:
      - bash
      - -c
      - >-
        rm -f /tmp/mongo-keyfile && openssl rand -base64 756 > /tmp/mongo-keyfile && chmod 400 /tmp/mongo-keyfile && chown mongodb:mongodb /tmp/mongo-keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
    # Initiates rs0 once (also on an existing seedDB volume) and is healthy only when this node is the writable primary.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --eval
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'seedmongodb:27017' }] }) }
          quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: always

  backend:
    image: seedtest/seed-test-backend:latest
    ports:
      - "8080:8080"
    container_name: "Seed-backend"
    depends_on:
      seedmongodb:
        condition: service_healthy
    restart: always
    environment:
      FRONTEND_URL: "http://localhost:4200"
      # replicaSet=rs0 enables transactions. The member host seedmongodb resolves only inside the compose network;
      # from the host machine connect with mongodb://...@localhost:27017/?directConnection=true
      DATABASE_URI: mongodb://SeedAdmin:SeedTest@seedmongodb:27017/?replicaSet=rs0
      # Required by backend/src/config.ts (64-char hex). Read from the root .env; compose refuses to start without it.
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET in .env}
      # The image runs with NODE_ENV=production (Secure cookie). This setup serves plain HTTP on localhost,
      # where a Secure cookie is never set and login fails. Remove this line when the backend is behind HTTPS.
      COOKIE_SECURE: "false"
      # Port 8080 is published without a reverse proxy; trusting X-Forwarded-For would let clients bypass rate limits.
      TRUST_PROXY: "false"
      REPORT_DELETION_TIME: 5
      TESTACCOUNT_NAME:
      TESTACCOUNT_REPO:
      TESTACCOUNT_TOKEN:
      SESSION_SECRET: "secretSessionKey"
      JIRA_SECRET: "secretJiraKey"
      JIRA_SALT: "BJ1yJTJ7AFql"
      EMAIL_AUTH:
      EMAIL_PW:
      EMAIL_PORT:
      EMAIL_HOST:
      GITHUB_CLIENT_SECRET:
      GITHUB_CLIENT_ID:
      PASSPORT_GITHUB_LOCAL_PW_FIELD: "id"
      MAX_SAVED_REPORTS:

  frontend:
    image: seedtest/seed-test-frontend:latest
    ports:
      - "4200:4200"
    container_name: "Seed-frontend"
    depends_on:
      - backend
    restart: always
    environment:
      GITHUB_CLIENT_ID:
      VERSION:
      API_SERVER: "http://localhost:8080/api"

volumes:
  seedDB:
