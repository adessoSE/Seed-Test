services:
  db:
    image: mongo:latest
    container_name: "Seed-db"
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: SeedAdmin
      MONGO_INITDB_ROOT_PASSWORD: SeedTest
    ports:
      - "27017:27017"
    # Single-node replica set rs0 for MongoDB transactions; same setup as docker-compose.yml (keyFile generated per start).
    entrypoint:
      - bash
      - -c
      - >-
        rm -f /tmp/mongo-keyfile && openssl rand -base64 756 > /tmp/mongo-keyfile && chmod 400 /tmp/mongo-keyfile && chown mongodb:mongodb /tmp/mongo-keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
    # Initiates rs0 once and is healthy only when this node is the writable primary.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --eval
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'db:27017' }] }) }
          quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    container_name: "Seed-backend"
    restart: on-failure
    environment:
      # replicaSet=rs0 enables transactions; the member host db resolves only inside the compose network
      DATABASE_URI: mongodb://SeedAdmin:SeedTest@db:27017/?replicaSet=rs0
      SESSION_SECRET: secretSessionKey
      JIRA_SECRET: secretJiraKey
      JIRA_SALT: BJ1yJTJ7AFql
      FRONTEND_URL: http://localhost:4200
      # The image runs with NODE_ENV=production (Secure cookie); this setup serves plain HTTP, where a Secure cookie is never set.
      COOKIE_SECURE: "false"
      # No reverse proxy in front: trusting X-Forwarded-For would let clients bypass rate limits.
      TRUST_PROXY: "false"
      PORT: 8080
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET in .env}
      PASSPORT_GITHUB_LOCAL_PW_FIELD: id
      MAX_SAVED_REPORTS: 3
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    container_name: "Seed-frontend"
    restart: on-failure
    environment:
      API_SERVER: http://localhost:8080/api
    depends_on:
      backend:
        condition: service_healthy
