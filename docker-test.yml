services:
  db:
    image: mongo:latest
    container_name: "Seed-db"
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME_FROM_WORKFLOW:?set MONGO_ROOT_USERNAME secret in the workflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD_FROM_WORKFLOW:?set MONGO_ROOT_PASSWORD secret in the workflow}
    # Single-node replica set rs0 for MongoDB transactions; same setup as docker-compose.yml (keyFile generated per start).
    entrypoint:
      - bash
      - -c
      - >-
        rm -f /tmp/mongo-keyfile && openssl rand -base64 756 > /tmp/mongo-keyfile && chmod 400 /tmp/mongo-keyfile && chown mongodb:mongodb /tmp/mongo-keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
    # Initiates rs0 once and is healthy only when this node is the writable primary.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --eval
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'db:27017' }] }) }
          quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    ports:
      - 8080:8080
    container_name: "Seed-backend"
    restart: on-failure
    environment:
      DATABASE_URI: ${DB_URI_FROM_WORKFLOW}
      EMAIL_AUTH: ${EMAIL_AUTH_FROM_WORKFLOW}
      EMAIL_PW: ${EMAIL_PW_FROM_WORKFLOW}
      EMAIL_PORT: ${EMAIL_PORT_FROM_WORKFLOW}
      EMAIL_HOST: ${EMAIL_HOST_FROM_WORKFLOW}
      FRONTEND_URL: ${FRONTEND_URL_FROM_WORKFLOW}
      GITHUB_CLIENT_SECRET: ${G_CLIENT_SECRET_FROM_WORKFLOW}
      GITHUB_CLIENT_ID: ${G_CLIENT_ID_FROM_WORKFLOW}
      PASSPORT_GITHUB_LOCAL_PW_FIELD: ${PASSPORT_GITHUB_LOCAL_PW_FIELD_FROM_WORKFLOW}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET_FROM_WORKFLOW:?set ENCRYPTION_SECRET secret in the workflow}
      SESSION_SECRET: ${SESSION_SECRET_FROM_WORKFLOW:?set SESSION_SECRET secret in the workflow}
      JIRA_SECRET: ${JIRA_SECRET_FROM_WORKFLOW:?set JIRA_SECRET secret in the workflow}
      JIRA_SALT: ${JIRA_SALT_FROM_WORKFLOW:?set JIRA_SALT secret in the workflow}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    ports:
      - 4200:4200
    container_name: "Seed-frontend"
    restart: on-failure
    environment:
      API_SERVER: ${API_SERVER_FROM_WORKFLOW}
      GITHUB_CLIENT_ID: ${G_CLIENT_ID_FROM_WORKFLOW}
      EMAIL_PW: ${EMAIL_PW_FROM_WORKFLOW}
      VERSION: ${VERSION_FROM_WORKFLOW}
    depends_on:
      backend:
        condition: service_healthy