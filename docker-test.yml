version: "3.0"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    ports:
      - 8080:8080
    container_name: "Seed-backend"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    ports:
      - 4200:4200
    container_name: "Seed-frontend"
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_SERVER="http://backend:8080/api"