<div [class.darkTheme]="isDark()" class="st-card st-card-default padding mat-app-background" id="report">
  <div id="report-header" class="st-card-header" style="white-space: nowrap;">
    <h3 class="SmallHeadline1" style="display: inline-block">Test Results</h3>

    <div class="st-button-row" style="text-align: right; float: right;">
      <button id="download_results" [class.disabledButton] ="!testDone()" [disabled]="!testDone()" class="button"
        matTooltip="Download Test Results" type="button" (click)=" downloadFile();"><em class="material-icons-outlined">file_download</em></button>
        @if (this.reportComponent() && !this.reportComponent()?.isSaved) {
          <button id="save_report" [class.disabledButton] ="!testDone()" [disabled]="!testDone()" class="button"
            matTooltip="Save Report" type="button" (click)=" saveReport(reportId());"><em class="material-icons-outlined">save</em></button>
          }
          @if (this.reportComponent() && this.reportComponent()?.isSaved) {
            <button id="unsave_report" [class.disabledButton] ="!testDone()" [disabled]="!testDone()" class="button"
              matTooltip="Do not Save Report" type="button" (click)=" unsaveReport(reportId());"><em class="material-icons-outlined">cancel</em></button>
            }
            <button (click)="exportHtmlToPDF()" class="button" matTooltip="Generate and download PDF report">PDF</button>
          </div>
        </div>
        <div id="testreport" class="st-card st-card-default padding st-fade-in" [hidden]=!showResults()>
          <div id="report-body" class="st-card-body">
            <div id="chartcontainer" class="chart-container" >
              <iframe #iframe title="Test StoryReport" id="testFrameReport" width="100%" height="1000" name="SELFHTML_in_a_box"></iframe>
            </div>
          </div>
        </div>
      </div>
