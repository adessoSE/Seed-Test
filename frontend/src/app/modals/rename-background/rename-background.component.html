<!-- rename Background Modal-->

<ng-template #renameBackground let-modal="dialogRef">
    <app-layout-modal />
    <div class="modal-header">
        <span id="modalHeader" class="MediumSubline1H4 modal-title">Change Background Title</span>
        <button type="button" class="close" aria-label="Close" (click)="modal.close()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <div tabindex="0" (keydown.enter)="enterSubmit($event)">
            <div class="form-group modalsContent">
                <div>
                    <label for="rename-background-title">Edit Background Title</label>
                    <input cdkFocusInitial id="rename-background-title" type="text" style="margin-left: 24px;" pattern="\S(.*\S)?" [formControl]="backgroundTitle" (keyup)="backgroundUnique()" required>
                </div>
            </div>
            
            <div class="modal-footer">
                <button id="submitRenameBackground" (click)="onClickSubmit()"  class="normalButton" [disabled]="!backgroundTitle.valid || backgroundTitle.value === this.background.name"
                [style.opacity]="!backgroundTitle.valid || backgroundTitle.value === this.background.name ?  '50%' : '100%'">Submit
                </button>
            </div>
        </div>
    </div>
</ng-template>
