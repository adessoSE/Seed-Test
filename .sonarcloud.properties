# typescript:S7739 flags the `then` property of Gherkin step objects ({ given, when, then }). That is the domain model, not a thenable, so the rule is a false positive here.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7739
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
